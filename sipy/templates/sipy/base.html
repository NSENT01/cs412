<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} | Sipy</title>
    <style>
        body {
            margin: 0;
            color: #202124;
            background: #f7f7f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        header {
            border-bottom: 1px solid #deded8;
            background: #ffffff;
        }

        .shell {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 18px 0;
        }

        h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 14px;
        }

        nav a {
            color: #3f5f54;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 28px 0 48px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            background: #ffffff;
            border: 1px solid #deded8;
            border-radius: 8px;
        }

        th,
        td {
            max-width: 280px;
            padding: 12px 14px;
            border-bottom: 1px solid #ededeb;
            text-align: left;
            vertical-align: top;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        th {
            color: #5f625f;
            background: #fbfbfa;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        tr:last-child td {
            border-bottom: 0;
        }

        .empty {
            padding: 20px;
            background: #ffffff;
            border: 1px solid #deded8;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <header>
        <div class="shell topbar">
            <h1>{{ page_title }}</h1>
            <nav>
                <a href="{% url 'profile_list' %}">Profiles</a>
                <a href="{% url 'cafe_list' %}">Cafes</a>
                <a href="{% url 'drink_list' %}">Drinks</a>
                <a href="{% url 'ranking_list' %}">Rankings</a>
                <a href="{% url 'want_to_try_list' %}">Want To Try</a>
                <a href="{% url 'follow_list' %}">Follows</a>
                <a href="{% url 'like_list' %}">Likes</a>
                <a href="{% url 'comment_list' %}">Comments</a>
            </nav>
        </div>
    </header>
    <main class="shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
