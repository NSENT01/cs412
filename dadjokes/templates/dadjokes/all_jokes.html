{% extends 'dadjokes/base.html' %}

{% block content %}
<div class="list">
    {% for joke in jokes %}
        <div class="card">
            <p class="cardMainText">{{ joke.text }}</p>
            <p><small>Added by {{ joke.name }}</small></p>
        </div>
    {% endfor %}
</div>
{% endblock %}
