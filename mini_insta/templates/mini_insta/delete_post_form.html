{% extends 'mini_insta/base.html' %}

{% block content %}
<a href="{% url 'show_post' post.pk %}" class="back_button">
    <img src="https://www.pngarts.com/files/8/Round-Back-Button-PNG-Transparent-Image.png" width="25" height="25">
</a>
    <div>
    <div class="postsGrid">
        <!--Get all photos to display in the post view-->
            {% for photo in post.get_all_photos %}
                <a href="{% url 'show_post' post.pk %}" class="postTile">
                    <img src="{{ photo.get_image_url }}" alt="Post photo">
                </a>
            {% endfor %}
        </div>
    <div>
        <!--Post caption and timestamp-->
        <p>{{post.caption}}</p>
        <p><small>{{post.timestamp}}</small></p>
        <!--Form for deleting a post-->
        <div class="confirmation">
            <form action="{% url 'delete_post' post.pk %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <input type="submit" name="Confirm" value="Confirm">
            </form>
            <form action="{% url 'personal_profile' %}" method="GET" enctype="multipart/form-data" class="secondary">
                {% csrf_token %}
                <input type="submit" name="Cancel" value="Cancel">
            </form>
        </div>
    </div>
</div>
{% endblock %}
