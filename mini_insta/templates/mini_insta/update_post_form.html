{% extends 'mini_insta/base.html' %}

{% block content %}
<div class="formWrapper">
    <h2>Update your post</h2>
    <!--Form for updating a post-->
    <form class="createForm" method="POST" action="{% url 'update_post' post.pk%}" enctype="multipart/form-data">
        {% csrf_token %}
        <!--Django form object-->
        <table>
            {{form.as_table}}
            <!--Separate field for submitting request-->
            
            <tr>
                <td></td>
                <td>
                    <input type="submit" name="Update" value="Update">
                    <a href="{% url 'show_post' post.pk %}" class="button secondary">Cancel</a>
                </td>
            </tr>
        </table>
    </form>
</div>
{% endblock %}
