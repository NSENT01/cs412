{% extends 'mini_insta/base.html' %}

{% block content %}
<div>
    <div class="postsGrid">
        <!--Get all photos to display in the post view-->
            {% for photo in post.get_all_photos %}
                <a href="{% url 'show_post' post.pk %}" class="postTile">
                    <img src="{{ photo.get_image_url }}" alt="Post photo">
                </a>
            {% endfor %}
        </div>
    <div>
        <!--Post caption and timestamp-->
        <p>{{post.caption}}</p>
        <p><small>{{post.timestamp}}</small></p>
        <div class="confirmation">
            <a href="{% url 'delete_post' post.pk %}" class="button secondary">Delete</a>
            <a href="{% url 'update_post' post.pk %}" class="button secondary">Update</a>
        </div>
    </div>
</div>
{% endblock %}
