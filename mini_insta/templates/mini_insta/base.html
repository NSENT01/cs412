{% load static %}

<html>
    <head>
        <title>Instagram</title>
        <link rel="stylesheet" href="{% static 'styles-mini-insta.css' %}">
    </head>
    <body>
        <!--Instagram title across all pages-->
        <header class="topbar"><h2 class="title">Instagram</h2></header>
        <!--Main content dynamically loaded based on route and template-->
        <main class="page">
            {% block content %}
            {% endblock %}
        </main>
        <!--Navigation bar with home button, and create post button in each profilr-->
        <nav class="navbar">
            <ul class="menu">
                <!--Nav bar for an authenticated user-->
                {% if request.user.is_authenticated %}
                <li class="menuItem"><a href="{% url 'show_feed' %}">
                    <img src="https://www.freeiconspng.com/uploads/home-button-png-icon-30.png" width="25" height="25">
                </a></li>
                <li class="menuItem"><a href="{% url 'home' %}">
                    <img src="https://www.freeiconspng.com/uploads/feed-icon-png-9.png" width="25" height="25">
                </a></li>
                <li class="menuItem"><a href="{% url 'create_post_form' %}">
                    <img src="https://www.freepnglogos.com/uploads/plus-icon/file-plus-font-awesome-svg-wikimedia-commons-10.png" width="25" height="25">
                </a></li>
                <li class="menuItem"><a href="{% url 'personal_profile' %}">
                    <img src="{{profile.profile_image_url}}" width="25" height="25" class="profileImageNav">
                </a></li>
                <li class="menuItem"><a href="{% url 'search' %}">
                    <img src="https://www.freeiconspng.com/uploads/search-icon-png-21.png" width="25" height="25">
                </a></li>
                <li class="menuItem">
                    <form method="POST" action="{% url 'logout' %}" enctype="multipart/form-data" class="logout">
                        {% csrf_token %}
                        <input type="image" src="https://w7.pngwing.com/pngs/853/997/png-transparent-undo-back-solid-icon.png" class="imageButton" alt="submit">
                            
                    </form>
                </li>
                {% else %}
                <!--Nav bar for an unauthenticated user-->
                <li class="menuItem"><a href="{% url 'home' %}">
                    <img src="https://www.freeiconspng.com/uploads/home-button-png-icon-30.png" width="25" height="25">
                </a></li>
                <li class="menuItem"><a href="{% url 'login' %}">
                    <img src="https://www.freeiconspng.com/uploads/black-login-icon--0.png" width="25" height="25">
                </a></li>
                {% endif %}
            </ul>
        </nav>
    </body>
</html>
