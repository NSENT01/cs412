{% extends 'mini_insta/base.html' %}

{% block content %}
    <div class="main">
        {% for profile in profiles %}
            <div>
                <img src="{{profile.profile_image_url}}" width="400">
                <h1>{{profile.display_name}}</h2>
                <h3>{{profile.username}}</h1>
                <p>{{profile.bio_text}}</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
