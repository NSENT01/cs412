{% extends 'mini_insta/base.html' %}

{% block content %}
<a href="{% url 'personal_profile' %}" class="back_button">
    <img src="https://www.pngarts.com/files/8/Round-Back-Button-PNG-Transparent-Image.png" width="25" height="25">
</a>
<div class="formWrapper">
    <h2>Create a new post</h2>
    <!--Form for uploading a post-->
    <form class="createForm" method="POST" action="{% url 'create_post_form' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <!--Django form object-->
        <table>
            {{form.as_table}}
            <!--Separate field for selecting image files-->
            
            <tr>
                <th>
                    <label for="image_url">Select Images: </label>
                </th>
                <td>
                    <input type="file" name="image_files" multiple required>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" name="Post" value="Post">
                    <a href="{% url 'personal_profile' %}" class="button secondary">Cancel</a>
                </td>
            </tr>
        </table>
    </form>
</div>
{% endblock %}
