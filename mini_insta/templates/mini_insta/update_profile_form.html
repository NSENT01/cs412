{% extends 'mini_insta/base.html' %}

{% block content %}
<a href="{% url 'personal_profile' %}" class="back_button">
    <img src="https://www.pngarts.com/files/8/Round-Back-Button-PNG-Transparent-Image.png" width="25" height="25">
</a>
<div class="formWrapper">
    <h2>Update your post</h2>
    <!--Form for updating a profile-->
    <form class="createForm" method="POST" action="{% url 'update_profile' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <!--Django form object-->
        <table>
            {{form.as_table}}
            <!--Separate field for submitting request-->
            
            <tr>
                <td></td>
                <td>
                    <input type="submit" name="Update" value="Update">
                    <a href="{% url 'personal_profile' %}" class="button secondary">Cancel</a>
                </td>
            </tr>
        </table>
    </form>
</div>
{% endblock %}
