{% extends 'mini_insta/base.html' %}

{% block content %}
<div class="main">
    <div class="accountHeader">
        <div class="profile">
            <img src="{{profile.profile_image_url}}" width="100" class="profileImage">
            <h3 class="profileText">{{profile.display_name}}</h2>
            <p class="profileText">{{profile.username}}</p>
            <p class="profileText"><small>{{profile.bio_text}}</small></p>
        </div>
        <div class="accountAnalytics">
            <div class="counts">
                <h2 class="profileText">TBD</h2>
                <p class="profileText">Posts</p>
            </div>
            <div class="counts">
                <h2 class="profileText">TBD</h2>
                <p class="profileText">Followers</p>
            </div>
            <div class="counts">
                <h2 class="profileText">TBD</h2>
                <p class="profileText">Following</p>
            </div>
        </div>
    </div>
    <div>

    </div>
</div>
{% endblock %}
